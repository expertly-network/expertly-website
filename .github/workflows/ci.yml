name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the image-push job grants itself packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  typecheck-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known high/critical advisories in anything that ships (devDependencies excluded).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Turbo runs `test` only in packages that define a test script; none defined = no-op pass.
      - name: Test
        run: pnpm test

      # No deployment config at build time — API_URL / SUPABASE_URL / SUPABASE_ANON_KEY are runtime
      # env vars on each Coolify app (apps/frontend/lib/env.ts).
      - name: Build
        run: pnpm build

  # Builds both service images on every PR (so a broken Dockerfile fails review, not the deploy)
  # and, on push to main only, pushes them to GHCR under this repo's own org
  # (ghcr.io/expertly-network/...) tagged :latest and :<commit sha> — the sha tag is what lets
  # you roll back to an exact build. Authenticated with the workflow's own GITHUB_TOKEN — no
  # personal-account PAT or extra secrets involved. Runs after the gate above passes.
  # First-time setup: after the first push, mark each package public in its GHCR package
  # settings (defaults to private), and make sure
  # Settings → Actions → General → Workflow permissions allows read/write.
  docker-build-push:
    name: Build (& Push on main) Docker Images
    needs: typecheck-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Coolify deploys prebuilt GHCR images (not a git-triggered build), so the
      # only way to auto-deploy on push is to call its deploy API once the new
      # :latest images have been pushed above. It deploys by TAG, not by app id:
      # every Coolify app tagged `autodeploy` (backend, frontend, search worker)
      # is redeployed. To add/remove an app from auto-deploy, tag/untag it in
      # Coolify — no CI or GitHub-secret change needed.
      #
      # force=true (not false): both old and new images share the same :latest
      # tag, and force=false let Coolify's deploy trigger return success while
      # silently skipping the actual re-pull/restart (observed: CI reported
      # this step green, but the running container kept serving a build from
      # well before that push). force=true makes it always re-pull and restart.
      # The token reaches the shell as an env var, never interpolated into the script text.
      - name: Trigger Coolify redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # Prints Coolify's response so the deploy log shows which apps were queued.
          curl --fail-with-body -X POST \
            "https://coolify.shreyansmaloo.site/api/v1/deploy?tag=autodeploy&force=true" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"
