name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the image-push job grants itself packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  typecheck-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

  # Builds and pushes both service images to GHCR under this repo's own org
  # (ghcr.io/expertly-network/...), authenticated with the workflow's own GITHUB_TOKEN —
  # no personal-account PAT or extra secrets involved. Runs only on push to main, after the
  # gate above passes. First-time setup: after the first push, mark each package public in
  # its GHCR package settings (defaults to private), and make sure
  # Settings → Actions → General → Workflow permissions allows read/write.
  docker-build-push:
    name: Build & Push Docker Images
    needs: typecheck-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/growxq-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Coolify deploys prebuilt GHCR images (not a git-triggered build), so the
      # only way to auto-deploy on push is to call its deploy API once the new
      # :latest images have been pushed above. It deploys by TAG, not by app id:
      # every Coolify app tagged `autodeploy` (backend, frontend, search worker)
      # is redeployed. To add/remove an app from auto-deploy, tag/untag it in
      # Coolify — no CI or GitHub-secret change needed.
      #
      # force=true (not false): both old and new images share the same :latest
      # tag, and force=false let Coolify's deploy trigger return success while
      # silently skipping the actual re-pull/restart (observed: CI reported
      # this step green, but the running container kept serving a build from
      # well before that push). force=true makes it always re-pull and restart.
      - name: Trigger Coolify redeploy
        run: |
          # Prints Coolify's response so the deploy log shows which apps were queued.
          curl --fail-with-body -X POST \
            "https://coolify.shreyansmaloo.site/api/v1/deploy?tag=autodeploy&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
