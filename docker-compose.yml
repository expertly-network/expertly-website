services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: growxq-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: growxq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./apps/frontend/.env
    ports:
      - "3000:3000"
